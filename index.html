<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Astro Game</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: black;
  overflow: hidden;
  font-family: Arial;
}

/* GAME RESPONSIVE */
#game {
  position: absolute;
  width: min(900px, 95vw);
  height: min(350px, 60vh);
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  background: url("bg.png");
  background-size: cover;
  overflow: hidden;
  border-radius: 12px;
}

#dino {
  position: absolute;
  width: 70px;
  height: 70px;
  left: 80px;
  bottom: 40px;
  background: url("dino.png") no-repeat center;
  background-size: contain;
}

.cactus {
  position: absolute;
  width: 45px;
  height: 70px;
  bottom: 40px;
  background: url("cactus.png") no-repeat center;
  background-size: contain;
}

#score {
  position: absolute;
  top: 10px;
  left: 15px;
  color: white;
  font-weight: bold;
}

#message {
  position: absolute;
  top: 30px;
  width: 100%;
  text-align: center;
  color: yellow;
}

/* HITBOX */
.hitbox {
  position: absolute;
  border: 2px solid red;
  pointer-events: none;
}

/* SCREENS */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  background: black;
  color: white;
  z-index: 10;
}

.hidden { display: none; }
</style>
</head>

<body>

<div id="game">
  <div id="score">0</div>
  <div id="message"></div>
  <div id="dino"></div>
</div>

<div id="menu" class="screen">
  <h1>Astro Game</h1>
  <button onclick="start()">START</button>
</div>

<div id="gameover" class="screen hidden">
  <h1>GAME OVER</h1>
  <p id="final"></p>
  <button onclick="start()">RESTART</button>
</div>

<script>

const game = document.getElementById("game");
const dino = document.getElementById("dino");
const scoreEl = document.getElementById("score");
const message = document.getElementById("message");

let cactus = null;
let raf = null;

/* IMPORTANT: HOLD H */
let showHitbox = false;

let state;

/* RESET */
function reset() {

  cancelAnimationFrame(raf);
  document.querySelectorAll(".hitbox").forEach(e => e.remove());

  if (cactus) {
    cactus.remove();
    cactus = null;
  }

  state = {
    running: false,
    score: 0,
    jumps: 0,
    speed: 6,
    y: 0,
    vel: 0,
    gravity: 0.8,
    jumping: false,
    cactusX: 1000,
    passed: false,
    slow: 1,
    startTime: Date.now()
  };

  scoreEl.innerText = "0";
  message.innerText = "";
}

/* START */
function start() {

  reset();

  document.getElementById("menu").classList.add("hidden");
  document.getElementById("gameover").classList.add("hidden");

  state.running = true;

  spawnCactus();
  raf = requestAnimationFrame(loop);
}

/* JUMP */
function jump() {
  if (!state.running || state.jumping) return;

  state.jumping = true;
  state.vel = 14;
}

/* CACTUS */
function spawnCactus() {
  cactus = document.createElement("div");
  cactus.className = "cactus";
  game.appendChild(cactus);

  state.cactusX = 1000;
  state.passed = false;
}

/* HIT */
function hit() {
  const dx = 80, dw = 70;
  const cx = state.cactusX, cw = 45;

  return (
    dx < cx + cw &&
    dx + dw > cx &&
    state.y < 70 &&
    state.y + 70 > 0
  );
}

/* HITBOX (ONLY WHILE HOLDING H) */
function drawHitbox() {

  document.querySelectorAll(".hitbox").forEach(e => e.remove());

  const d = document.createElement("div");
  d.className = "hitbox";
  d.style.left = "80px";
  d.style.bottom = (40 + state.y) + "px";
  d.style.width = "70px";
  d.style.height = "70px";
  game.appendChild(d);

  if (cactus) {
    const c = document.createElement("div");
    c.className = "hitbox";
    c.style.left = state.cactusX + "px";
    c.style.bottom = "40px";
    c.style.width = "45px";
    c.style.height = "70px";
    game.appendChild(c);
  }
}

/* LOOP */
function loop() {

  if (!state.running) return;

  state.vel -= state.gravity;
  state.y += state.vel;

  if (state.y < 0) {
    state.y = 0;
    state.vel = 0;
    state.jumping = false;
  }

  dino.style.bottom = (40 + state.y) + "px";

  if (cactus) {

    state.cactusX -= state.speed;
    cactus.style.left = state.cactusX + "px";

    if (hit()) return gameOver();

    if (state.cactusX < 80) {
      state.score++;
      scoreEl.innerText = state.score;

      cactus.remove();
      cactus = null;

      setTimeout(spawnCactus, 400);
    }
  }

  // HITBOX ONLY WHILE HOLDING H
  if (showHitbox) drawHitbox();
  else document.querySelectorAll(".hitbox").forEach(e => e.remove());

  raf = requestAnimationFrame(loop);
}

/* GAME OVER */
function gameOver() {

  state.running = false;
  cancelAnimationFrame(raf);

  document.getElementById("gameover").classList.remove("hidden");

  document.getElementById("final").innerText =
    "Score: " + state.score;
}

/* INPUT */
document.addEventListener("keydown", e => {

  if (e.code === "Space") jump();

  if (e.code === "KeyH") showHitbox = true;
});

document.addEventListener("keyup", e => {

  if (e.code === "KeyH") showHitbox = false;
});

/* MOBILE */
document.addEventListener("touchstart", () => {
  if (!document.getElementById("menu").classList.contains("hidden")) return;
  if (!document.getElementById("gameover").classList.contains("hidden")) return;
  jump();
});

document.addEventListener("click", () => {
  if (!document.getElementById("menu").classList.contains("hidden")) return;
  if (!document.getElementById("gameover").classList.contains("hidden")) return;
  jump();
});

</script>

</body>
</html>
